# MigraTux server stack (M3). Start with: server/setup.sh, then
#   docker compose up -d      (in server/)
# Settings come from server/.env; the config files are rendered by setup.sh
# into ${DATA_DIR}/conf.
name: migratux

services:
  # File share \\SERVER_IP\SHARE_NAME: one folder per client (inventory, data, report).
  samba:
    build:
      context: ./samba
      network: host
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      SMB_USER: ${SMB_USER}
      SMB_PASSWORD: ${SMB_PASSWORD}
    volumes:
      - ${DATA_DIR}/conf/smb.conf:/etc/samba/smb.conf:ro
      - ${DATA_DIR}/share:/srv/share

  # Proxy-DHCP (PXE boot info only, the router keeps handing out IPs) + TFTP.
  # Needs the host network to see the DHCP broadcasts of the clients.
  pxe:
    build:
      context: ./pxe
      network: host
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${DATA_DIR}/conf/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ${DATA_DIR}/tftp:/srv/tftp:ro

  # HTTP: ISO, autoinstall files, client scripts; receives status events and
  # disk images (PUT); lets a client switch off its own PXE job (DELETE).
  http:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./http/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR}/http:/srv/http:ro
      - ${DATA_DIR}/tftp/grub/hosts:/srv/pxe-hosts
      - ${DATA_DIR}/events:/srv/events
      - ${DATA_DIR}/images:/srv/images
