# MigraTux HTTP server. Lab prototype: no TLS and no login.
# Runs as root so that files written here and by Samba have the same owner.
user root;
worker_processes 2;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    server {
        listen 80;
        root /srv/http;

        # ISO, autoinstall files, client bundle (read-only).
        location / {
            autoindex on;
        }

        # PXE jobs (grub/hosts/<mac>.cfg). A client deletes its own job when
        # it is done, so the next network boot starts from the local disk.
        location /pxe/hosts/ {
            alias /srv/pxe-hosts/;
            dav_methods DELETE;
            limit_except GET DELETE {
                deny all;
            }
        }

        # Status events: PUT /events/<mac>/<step>, body = one line of text.
        location /events/ {
            alias /srv/events/;
            autoindex on;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            client_max_body_size 64k;
        }

        # Disk images for rollback: PUT/GET /images/<HOST>/<file>.
        location /images/ {
            alias /srv/images/;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            client_max_body_size 0;
            client_body_temp_path /srv/images/.upload;
            client_body_timeout 600s;
            send_timeout 600s;
        }
    }
}
